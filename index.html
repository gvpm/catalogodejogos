<html lang="pt-BR">

<head>

    <link rel="apple-touch-icon" href="icon.svg?v=1">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        button i {
            pointer-events: none;
        }

        body {
            background: #121212;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .games-container {

            display: grid;

            grid-template-columns:
                repeat(3, 220px);

            justify-content: center;

            gap: 20px;

        }

        .game-card {
            position: relative;

            background: #1e1e1e;
            border-radius: 16px;
            overflow: hidden;

            transition: .2s ease;

            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, .05);

            box-shadow:
                0 4px 18px rgba(0, 0, 0, .28);
        }

        .game-card:hover {

            transform:
                translateY(-4px) scale(1.02);

            box-shadow:
                0 12px 28px rgba(0, 0, 0, .45);

        }

        .game-image {
            width: 100%;
            aspect-ratio: 1 / 1.35;
            object-fit: cover;
            background: #2b2b2b;
        }

        .game-info {
            padding: 12px;
            text-align: center;
        }

        .game-title {
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.3;
        }

        .game-meta {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 6px;

            margin-top: 8px;

            color: rgba(255, 255, 255, .68);

            font-size: .82rem;

            font-weight: 500;

            letter-spacing: .2px;

        }

        .game-meta i {

            font-size: .78rem;

            opacity: .9;

        }

        .meta-item {

            display: flex;

            align-items: center;

            gap: 5px;

        }

        .favorite-button {
            position: absolute;

            top: 10px;
            left: 10px;
            width: 38px;
            height: 38px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, .38);

            color: white;

            font-size: 1.2rem;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 10;

            backdrop-filter: blur(1px);

            transition: .2s ease;
        }

        .favorite-button.active {
            color: #ff3b5c;
        }

        .modal-favorite-button {
            position: absolute;

            top: 14px;
            left: 14px;

            width: 46px;
            height: 46px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, .42);

            color: white;

            font-size: 1.4rem;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 30;

            backdrop-filter: blur(1px);

            transition: .2s ease;
        }

        .modal-rulebook-button {

            position: absolute;

            bottom: 14px;
            right: 14px;

            width: 46px;
            height: 46px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, .42);

            color: white;

            font-size: 1.3rem;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 30;

            backdrop-filter: blur(3px);

            transition: .2s ease;
        }


        .modal-favorite-button.active {
            color: #ff3b5c;
        }

        .favorite-button i,
        .modal-favorite-button i {
            transform: translateY(1px);
        }

        .modal {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .92);

            opacity: 0;
            pointer-events: none;

            transition: .2s ease;

            z-index: 999;

            overflow-y: auto;

            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            position: relative;

            max-width: 700px;
            width: 100%;

            margin: 40px auto;

            background: #1b1b1b;

            border-radius: 20px;

            overflow: visible;
            animation: zoom .2s ease;
        }

        .close-button {
            position: absolute;

            top: 14px;
            right: 14px;

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, .42);

            color: white;

            font-size: 1.4rem;

            cursor: pointer;

            z-index: 30;

            display: flex;
            align-items: center;
            justify-content: center;

            backdrop-filter: blur(1px);

            transition: .2s ease;
        }

        .close-button:hover {
            background: rgba(0, 0, 0, .95);
        }

        .modal-image {
            width: 100%;
            max-height: 75vh;

            object-fit: contain;

            background: #222;
        }

        .modal-image-wrapper {

            position: relative;

        }

        .modal-body {
            padding: 20px;
        }

        .modal-title {
            text-align: center;

            margin-top: 10px;

            font-size: 1.3rem;
            font-weight: bold;
        }

        .modal-meta {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            margin-top: 12px;

            color: rgba(255, 255, 255, .72);

            font-size: .95rem;

            font-weight: 500;

        }

        .modal-meta {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

        }

        .modal-meta-top {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

        }

        .modal-meta .meta-item {

            display: flex;

            align-items: center;

            gap: 6px;

        }

        .modal-rules {
            margin-top: 8px;

            line-height: 1.7;

            color: #ddd;

            white-space: pre-line;

            text-align: left;
        }

        .modal-rules h3 {
            margin-top: 18px;
            margin-bottom: 8px;

            color: white;
        }

        body.modal-open {
            overflow: hidden;
        }

        @keyframes zoom {
            from {
                transform: scale(.92);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .games-count {
            margin-top: 28px;

            text-align: center;

            color: rgba(255, 255, 255, .6);

            font-size: .95rem;
        }

        .floating-menu {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9999;
            transition:
                opacity .22s ease,
                transform .22s ease;
        }

        .floating-menu.hidden {

            opacity: 0;

            transform:
                translateY(20px) scale(.92);
            pointer-events: none;

        }

        .menu-button {
            width: 58px;
            height: 58px;

            border: none;
            border-radius: 50%;

            background: rgba(31, 31, 31, 0.849);

            backdrop-filter: blur(3px);

            color: white;

            font-size: 1.5rem;

            cursor: pointer;

            box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
        }



        .menu-panel {
            position: absolute;

            right: 0;
            bottom: 74px;

            width: 240px;
            background: rgba(24, 24, 24, .88);

            border-radius: 18px;

            padding: 12px;

            opacity: 0;
            pointer-events: none;

            transform: translateY(10px);

            transition: .2s ease;
            backdrop-filter: blur(12px);

            display: flex;

            flex-direction: column;

            gap: 10px;

        }

        .menu-panel.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .menu-option {

            width: 100%;

            border: none;

            background: rgba(255, 255, 255, .04);

            color: white;

            padding: 14px 16px;

            border-radius: 16px;

            cursor: pointer;

            font-size: .97rem;

            font-weight: 600;

            letter-spacing: .2px;

            text-align: left;

            display: flex;

            align-items: center;

            gap: 12px;

            transition: .18s ease;

            backdrop-filter: blur(3px);
            white-space: nowrap;

        }

        .menu-option:hover {

            background: rgba(255, 255, 255, .08);

            transform: translateY(-1px);

        }

        .clear-filters-button {
            margin-top: 10px;

            background: #5a1d1d;

            color: #ff8d8d;

            display: none;
        }

        .clear-filters-button.active {
            display: block;
        }



        .filters-title {
            font-size: 1rem;
            font-weight: bold;

            margin-bottom: 14px;
        }

        .range-values {
            display: flex;
            justify-content: center;

            margin-bottom: 10px;

            color: #aaa;
        }

        .range-group {
            position: relative;
        }

        .range-group input {
            width: 100%;
        }

        .dice-modal {

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .92);

            z-index: 99999;

            display: flex;

            align-items: flex-start;

            justify-content: center;

            overflow-y: auto;

            padding: 24px 20px;

            opacity: 0;
            pointer-events: none;

            transition: .2s ease;

            padding: 20px;

        }

        .filters-modal {
            background: rgba(0, 0, 0, .55);
        }

        .dice-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .dice-content {

            position: relative;

            width: 100%;
            max-width: 520px;

            background: #1b1b1b;

            border-radius: 24px;

            padding: 32px 24px;

            animation: zoom .2s ease;

            margin: auto 0;

        }

        .dice-icon {

            font-size: 4rem;

            text-align: center;

            margin-bottom: 12px;

        }

        .dice-result {

            text-align: center;

            font-size: 4rem;

            font-weight: bold;

            margin-bottom: 18px;

        }

        .timer-finished {
            color: #ff4d6d;
        }

        .dice-input-wrapper {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 24px;

        }

        .dice-label {

            font-size: 2rem;

            font-weight: bold;

            color: #aaa;

        }

        .dice-input {

            width: 120px;

            background: #262626;

            border: none;

            border-radius: 16px;

            padding: 16px;

            text-align: center;

            color: white;

            font-size: 2rem;

            outline: none;

        }

        .dice-roll-button {

            width: 100%;

            border: none;

            border-radius: 18px;

            background: #2f2f2f;

            color: white;

            padding: 18px;

            font-size: 1.1rem;

            cursor: pointer;

            transition: .2s ease;

        }

        .dice-roll-button:hover {
            background: #3a3a3a;
        }

        .dice-loading {

            opacity: .7;

            pointer-events: none;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .dice-spinner {

            width: 70px;
            height: 70px;

            border-radius: 50%;

            border: 6px solid rgba(255, 255, 255, .15);

            border-top-color: white;

            margin: 0 auto 18px auto;

            animation: spin .8s linear infinite;

        }

        .timer-inputs {

            display: flex;

            justify-content: center;

            gap: 18px;

            margin-bottom: 24px;

        }

        .timer-group {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

        }

        .timer-label {

            color: #aaa;

            font-size: .95rem;

        }

        .timer-buttons {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }

        .mechanics-inline {
            width: 100%;
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            flex-wrap: wrap;

            margin-top: 8px;

            color: rgba(255, 255, 255, .72);

            font-size: .95rem;

            font-weight: 500;

        }

        .mechanics-inline i {

            font-size: .92rem;

            color: rgba(255, 255, 255, .82);

        }

        .mechanics-inline-list {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

        }

        .mechanic-inline-tag {

            color: rgba(255, 255, 255, .62);

            text-decoration: none;

            font-size: .72rem;

            line-height: 1;

            transition: .15s ease;

        }

        .mechanic-inline-tag::after {

            content: ",";

            margin-right: 5px;

            opacity: .45;

        }

        .mechanic-inline-tag:last-child::after {

            display: none;

        }

        .mechanic-inline-tag:hover {

            color: white;

        }

        .mechanic-inline-tag:visited,
        .mechanic-inline-tag:active {

            color: rgba(255, 255, 255, .62);

        }

        .mechanics-filters-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

            max-height: 320px;

            overflow-y: auto;

            padding-right: 4px;

        }

        .mechanics-filter-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            color: rgba(255, 255, 255, .82);

            font-size: .9rem;

        }

        .mechanics-filter-left {

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .mechanics-filter-count {

            color: rgba(255, 255, 255, .4);

            font-size: .82rem;

        }

        .mechanics-action-button {

            border: none;

            background: rgba(255, 255, 255, .06);

            color: rgba(255, 255, 255, .82);

            border-radius: 10px;

            padding: 6px 10px;

            cursor: pointer;

            font-size: .78rem;

            transition: .15s ease;

        }

        .mechanics-action-button:hover {

            background: rgba(255, 255, 255, .12);

        }

        @media (max-width:700px) {

            body {
                padding: 16px;
            }

            .games-container {

                grid-template-columns:
                    repeat(2, calc(50vw - 24px)) !important;

                gap: 14px !important;

                justify-content: center !important;

            }

            .game-card {
                width: 100%;
            }

            .game-title {
                font-size: 1rem;
            }

            .game-info {
                padding: 14px;
            }

            .menu-button {
                width: 86px !important;
                height: 86px !important;

                font-size: 2rem !important;
            }

            .favorite-button {

                width: 42px !important;
                height: 42px !important;

                font-size: 1.5rem !important;
            }

            .modal-favorite-button {

                width: 52px !important;
                height: 52px !important;

                font-size: 1.8rem !important;
            }

            .modal-rulebook-button {

                width: 52px !important;
                height: 52px !important;

                font-size: 1.8rem !important;
            }


            .close-button {
                width: 52px !important;
                height: 52px !important;

                font-size: 1.8rem !important;
            }

            .menu-panel {

                width: 250px !important;
                bottom: 96px !important;
            }

            .menu-option {

                padding: 20px !important;

                font-size: 1.08rem !important;
            }

            .menu-option i {

                width: 20px;

                text-align: center;

                opacity: .92;

            }

            .range-group input {

                height: 40px !important;
            }

        }

        .finger-status {

            text-align: center;

            font-size: 1.15rem;

            margin-top: 38px;

            margin-bottom: 10px;

            color: white;

            min-height: 32px;
        }

        .finger-area {

            position: relative;

            width: 100%;
            height: 340px;

            margin-top: 20px;

            border-radius: 18px;

            background: #262626;

            overflow: hidden;

            touch-action: none;

            -webkit-touch-callout: none;

            -webkit-user-select: none;
            user-select: none;

            -webkit-tap-highlight-color:
                transparent;
        }

        .finger-point {

            position: absolute;

            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: rgba(255, 255, 255, .08);

            border: 2px solid rgba(255, 255, 255, .22);

            transform: translate(-50%, -50%);

            transition: .15s ease;
        }

        .finger-point.selected {

            background: #4dffac;

            animation: fingerBlink .8s infinite;
        }

        .finger-loading {

            text-align: center;

            margin-top: 18px;

            font-size: 2rem;

            opacity: 0;

            transition: .2s ease;
        }

        .finger-loading.active {

            opacity: 1;

        }

        .finger-loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes fingerBlink {

            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: .55;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }
    </style>
</head>

    <div class="games-count" id="gamesCount"></div>

        <div class="modal-content">

            <button class="close-button" id="closeButton"><i class="fa-solid fa-xmark"></i></button>

            <button class="modal-favorite-button" id="modalFavoriteButton">

            </button>
            <div class="modal-image-wrapper">

                <img id="modalImage" class="modal-image">

                <button class="modal-rulebook-button" id="modalRulebookButton">
                    <i class="fas fa-circle-info"></i>
                </button>

            </div>
            <div class="modal-body">

                <div id="modalTitle" class="modal-title"></div>

                <div id="modalMeta" class="modal-meta"></div>

                <div id="modalRules" class="modal-rules"></div>

            </div>

        </div>

    </div>
    <div class="dice-modal" id="diceModal">

        <div class="dice-content">

            <button class="close-button" id="diceCloseButton">
                <i class="fa-solid fa-xmark"></i>

                <i class="fa-solid fa-dice"></i>

            <div class="dice-input-wrapper">

                <div class="dice-label">
                    D
                </div>

                <input type="number" min="2" value="6" id="diceInput" class="dice-input">

            </div>

            <button class="dice-roll-button" id="diceRollButton">

        </div>

    </div>
    <div class="dice-modal" id="timerModal">

            <div class="timer-buttons">

                <button class="dice-roll-button" id="startTimerButton">

                <button class="dice-roll-button" id="pauseTimerButton">

                    Pausar

                </button>

                <button class="dice-roll-button" id="stopTimerButton">

                    Stop

            </div>

        </div>

    </div>

            </div>

            <div class="filters-title" style="
                text-align:center;

                Filtros

                background:#222;

            ">

                <div style="
                    text-align:center;
                    color:#aaa;

                ">
                    Jogadores
                </div>

                <div class="range-values">
                    <span id="playersLabel"></span>
                </div>

                <div class="range-group">
                    <input type="range" id="playersRange">
                </div>

            </div>

                    <div style="
            display:flex;

        </button>

    </div>

    <script>
        const CACHE_BUSTER = Date.now();
        if ('serviceWorker' in navigator) {

            navigator.serviceWorker
                .getRegistrations()
                .then(registrations => {

                    registrations.forEach(reg => {

                        reg.unregister();

                    });

                });

        }

        const container = document.getElementById('gamesContainer');
        const gamesCount =
            document.getElementById('gamesCount');

        const modal = document.getElementById('gameModal');

        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalMeta =
            document.getElementById('modalMeta');
        const modalRules = document.getElementById('modalRules');

        const modalFavoriteButton =
            document.getElementById('modalFavoriteButton');
        const modalRulebookButton =
            document.getElementById('modalRulebookButton');

        const menuButton =
            document.getElementById('menuButton');

        const filtersModal =
            document.getElementById('filtersModal');
        const mechanicsFiltersList =
            document.getElementById(
                'mechanicsFiltersList'
            );



        const uncheckAllMechanics =
            document.getElementById(
                'uncheckAllMechanics'
            );

        const filtersCloseButton =
            document.getElementById(
                'filtersCloseButton'
            );

        const playersRange =
            document.getElementById('playersRange');

        const playersLabel =
            document.getElementById('playersLabel');
        const timeRange =
            document.getElementById('timeRange');

        const timeLabel =
            document.getElementById('timeLabel');

        const closeButton =
            document.getElementById('closeButton');

        const menuPanel =
            document.getElementById('menuPanel');

        const filtersButton =
            document.getElementById('filtersButton');


        const clearFiltersButton =
            document.getElementById('clearFiltersButton');

        const diceButton =
            document.getElementById('diceButton');
        const fingerSelectorButton =
            document.getElementById(
                'fingerSelectorButton'
            );

        const fingerSelectorModal =
            document.getElementById(
                'fingerSelectorModal'
            );

        const closeFingerSelectorButton =
            document.getElementById(
                'closeFingerSelectorButton'
            );

        const fingerArea =
            document.getElementById(
                'fingerArea'
            );

        const fingerStatus =
            document.getElementById(
                'fingerStatus'
            );

        const fingerLoading =
            document.getElementById(
                'fingerLoading'
            );

        const diceModal =
            document.getElementById('diceModal');

        const diceCloseButton =
            document.getElementById('diceCloseButton');

        const diceRollButton =
            document.getElementById('diceRollButton');

        const diceInput =
            document.getElementById('diceInput');

        const diceResult =
            document.getElementById('diceResult');

        const catalogButton =
            document.getElementById('catalogButton');

        const timerButton =
            document.getElementById('timerButton');

        const timerModal =
            document.getElementById('timerModal');

        const timerCloseButton =
            document.getElementById('timerCloseButton');

        const timerDisplay =
            document.getElementById('timerDisplay');

        const minutesInput =
            document.getElementById('minutesInput');

        const secondsInput =
            document.getElementById('secondsInput');

        const startTimerButton =
            document.getElementById('startTimerButton');

        const pauseTimerButton =
            document.getElementById('pauseTimerButton');

        const stopTimerButton =
            document.getElementById('stopTimerButton');

        const timerInputs =
            document.querySelector('.timer-inputs');
        let allGames = [];
        let rulesData = [];
        let mechanicsData = [];

        let globalMinPlayers = 1;
        let globalMaxPlayers = 12;

        let globalMinTime = 5;
        let globalMaxTime = 120;

        let currentPlayers = null;
        let currentTime = null;

        let selectedMechanics = [];


        function getFavorites() {

            return JSON.parse(
                localStorage.getItem('favoriteGames') || '[]'
            );

        }

        function saveFavorites(favorites) {

            localStorage.setItem(
                'favoriteGames',
                JSON.stringify(favorites)
            );

        }

        function toggleFavorite(gameTitle) {

            let favorites = getFavorites();

            const index = favorites.indexOf(gameTitle);

            if (index >= 0) {

                favorites.splice(index, 1);

            } else {

                favorites.push(gameTitle);

            }

            saveFavorites(favorites);

            renderGames();

        }
        function updateFiltersUI() {

            const hasFilter =
                currentPlayers !== null ||
                currentTime !== null ||
                selectedMechanics.length > 0;

            clearFiltersButton.classList.toggle(
                'active',
                hasFilter,

            );

        }
        function getMechanicsHTML(game) {

            if (!game.mechanics || !game.mechanics.length) {
                return '';
            }

            const mechanics = game.mechanics
                .map(id =>
                    mechanicsData.find(m => m.id === id)
                )
                .filter(Boolean);

            if (!mechanics.length) {
                return '';
            }

            return `

    <div class="mechanics-inline">

        <i class="fa-solid fa-gears"></i>

        <div class="mechanics-inline-list">

            ${mechanics.map(mechanic => `

                <a
                    href="${mechanic.url}"
                    target="_blank"
                    class="mechanic-inline-tag"
                >
                    ${mechanic.name}
                </a>

            `).join('')}

        </div>

    </div>

`;
        }


        function renderMechanicsFilters() {

            mechanicsFiltersList.innerHTML = '';

            const usedMechanicIds = [

                ...new Set(

                    allGames.flatMap(
                        game => game.mechanics || []
                    )

                )

            ];

            mechanicsData

                .filter(mechanic =>
                    usedMechanicIds.includes(mechanic.id)
                )

                .sort((a, b) =>
                    a.name.localeCompare(
                        b.name,
                        'pt-BR',
                        { sensitivity: 'base' }
                    )
                )

                .forEach(mechanic => {

                    const gamesCount = allGames.filter(game => {

                        if (
                            currentPlayers !== null &&
                            (
                                currentPlayers < game.minPlayers ||
                                currentPlayers > game.maxPlayers
                            )
                        ) {
                            return false;
                        }

                        if (
                            currentTime !== null &&
                            game.time > currentTime
                        ) {
                            return false;
                        }

                        const otherSelectedMechanics =
                            selectedMechanics.filter(
                                id => id !== mechanic.id
                            );

                        if (
                            !otherSelectedMechanics.every(id =>
                                game.mechanics?.includes(id)
                            )
                        ) {
                            return false;
                        }

                        return game.mechanics?.includes(mechanic.id);

                    }).length;

                    const item =
                        document.createElement('label');

                    item.className =
                        'mechanics-filter-item';

                    item.innerHTML = `

                <div class="mechanics-filter-left">

                    <input
                        type="checkbox"
                        value="${mechanic.id}"
                        ${selectedMechanics.includes(mechanic.id)
                            ? 'checked'
                            : ''
                        }
                    >

                    <span>
                        ${mechanic.name}
                    </span>

                </div>

                <span class="mechanics-filter-count">
                    (${gamesCount})
                </span>

            `;

                    const checkbox =
                        item.querySelector('input');

                    checkbox.addEventListener(
                        'change',
                        () => {

                            const id =
                                Number(checkbox.value);

                            if (checkbox.checked) {

                                if (
                                    !selectedMechanics.includes(id)
                                ) {

                                    selectedMechanics.push(id);

                                }

                            } else {

                                selectedMechanics =
                                    selectedMechanics.filter(
                                        m => m !== id
                                    );

                            }

                            renderGames();

                        }
                    );

                    mechanicsFiltersList.appendChild(item);

                });

        }
        function renderGames() {

            container.innerHTML = '';

            const favorites = getFavorites();

            const favoriteGames = [];
            const normalGames = [];

            allGames
                .filter(game => {

                    if (
                        game.minPlayers === 0 &&
                        game.maxPlayers === 0
                    ) {
                        return true;
                    }

                    const playersMatch =

                        currentPlayers === null ||

                        (
                            currentPlayers >= game.minPlayers &&
                            currentPlayers <= game.maxPlayers
                        );

                    const timeMatch =

                        currentTime === null ||

                        game.time <= currentTime;

                    const mechanicsMatch =

                        selectedMechanics.length === 0 ||

                        selectedMechanics.every(mechanicId =>
                            game.mechanics?.includes(mechanicId)
                        );

                    return (
                        playersMatch &&
                        timeMatch &&
                        mechanicsMatch
                    );

                })
                .forEach(game => {

                    if (favorites.includes(game.title)) {

                        favoriteGames.push(game);

                    } else {

                        normalGames.push(game);

                    }

                });

            favoriteGames.sort((a, b) =>
                favorites.indexOf(a.title) - favorites.indexOf(b.title)
            );

            normalGames.sort((a, b) =>
                a.title.localeCompare(
                    b.title,
                    'pt-BR',
                    { sensitivity: 'base' }
                )
            );

            const orderedGames = [
                ...favoriteGames,
                ...normalGames
            ];
            gamesCount.innerText =
                `${orderedGames.length} Jogos`;

            orderedGames.forEach(game => {

                const isFavorite =
                    favorites.includes(game.title);

                const card = document.createElement('div');

                card.className = 'game-card';

                card.innerHTML = `

                    <button class="favorite-button ${isFavorite ? 'active' : ''}">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                    <img
    src="images/${game.image}?v=${CACHE_BUSTER}"
    class="game-image"
>

<div class="game-info">

    <div class="game-title">
        ${game.title}
    </div>

<div class="game-meta">

    <div class="meta-item">

        <i class="fa-solid fa-user-group"></i>

        <span>
            ${game.minPlayers}-${game.maxPlayers}
        </span>

    </div>

    <div class="meta-item">

        <i class="fa-solid fa-stopwatch"></i>

        <span>
            ${game.time}m
        </span>

    </div>

</div>

</div>
                `;

                const favoriteButton =
                    card.querySelector('.favorite-button');

                favoriteButton.addEventListener('click', (e) => {

                    e.stopPropagation();

                    toggleFavorite(game.title);

                });

                card.addEventListener('click', () => {

                    modalImage.src =
                        `images/${game.image}?v=${CACHE_BUSTER}`;

                    modalTitle.innerText = game.title;

                    modalMeta.innerHTML = `

    <div class="meta-item">

        <i class="fa-solid fa-user-group"></i>

        <span>
            ${game.minPlayers}-${game.maxPlayers}
        </span>

    </div>

    <div class="meta-item">

        <i class="fa-solid fa-stopwatch"></i>

        <span>
            ${game.time}m
        </span>

    </div>

`;

                    modalMeta.innerHTML = `

    <div class="modal-meta-top">

        <div class="meta-item">

            <i class="fa-solid fa-user-group"></i>

            <span>
                ${game.minPlayers}-${game.maxPlayers}
            </span>

        </div>

        <div class="meta-item">

            <i class="fa-solid fa-stopwatch"></i>

            <span>
                ${game.time}m
            </span>

        </div>

    </div>

    ${getMechanicsHTML(game)}

`;

                    modalRules.innerHTML = game.rules ?? "";
                    if (game.rulebook) {

                        modalRulebookButton.style.display = 'flex';

                        modalRulebookButton.onclick = (e) => {

                            e.stopPropagation();

                            window.open(
                                `rulebooks/${game.rulebook}?v=${CACHE_BUSTER}`,
                                '_blank'
                            );

                        };

                    } else {

                        modalRulebookButton.style.display = 'none';

                    }

                    const favorites = getFavorites();

                    modalFavoriteButton.classList.toggle(
                        'active',
                        favorites.includes(game.title)
                    );

                    modalFavoriteButton.onclick = (e) => {

                        e.stopPropagation();

                        toggleFavorite(game.title);

                        modalFavoriteButton.classList.toggle(
                            'active'
                        );

                    };

                    modal.classList.add('active');

                    document.body.classList.add('modal-open');

                    history.pushState({ modal: true }, "");

                });

                container.appendChild(card);

            });
            renderMechanicsFilters();

            updateFiltersUI();


        }
        Promise.all([

            fetch(
                `./jogos.json?v=${CACHE_BUSTER}`,
                {
                    cache: 'no-store'
                }
            ).then(r => r.json()),

            fetch(
                `./rules.json?v=${CACHE_BUSTER}`,
                {
                    cache: 'no-store'
                }
            ).then(r => r.json()),

            fetch(
                `./mechanics.json?v=${CACHE_BUSTER}`,
                {
                    cache: 'no-store'
                }
            ).then(r => r.json())

        ])

            .then(([games, rules, mechanics]) => {

                rulesData = rules;
                mechanicsData = mechanics;

                allGames = games.map(game => {

                    const ruleMatch = rulesData.find(
                        r => r.id === game.id
                    );

                    return {

                        ...game,

                        rules: ruleMatch
                            ? ruleMatch.rules
                            : ""

                    };

                });

                const validGames = allGames.filter(g => {

                    return (
                        Number.isFinite(Number(g.minPlayers)) &&
                        Number.isFinite(Number(g.maxPlayers)) &&
                        Number(g.minPlayers) > 0 &&
                        Number(g.maxPlayers) > 0
                    );

                });

                if (validGames.length > 0) {

                    globalMinPlayers = Math.min(
                        ...validGames.map(g =>
                            Number(g.minPlayers)
                        )
                    );

                    globalMaxPlayers = Math.max(
                        ...validGames.map(g =>
                            Number(g.maxPlayers)
                        )
                    );
                    globalMinTime = Math.min(
                        ...validGames.map(g =>
                            Number(g.time || 0)
                        )
                    );

                    globalMaxTime = Math.max(
                        ...validGames.map(g =>
                            Number(g.time || 0)
                        )
                    );

                } else {

                    globalMinPlayers = 1;
                    globalMaxPlayers = 12;
                    globalMinTime = 5;
                    globalMaxTime = 120;

                }

                currentPlayers = null;

                playersRange.min = globalMinPlayers;
                playersRange.max = globalMaxPlayers;

                playersRange.value = globalMinPlayers;
                timeRange.min = globalMinTime;

                timeRange.max = globalMaxTime;

                timeRange.value = globalMaxTime;

                playersLabel.innerText =
                    '? jogadores';

                timeLabel.innerText =
                    '? min';

                renderGames();

            });

        function closeModal() {

            modal.classList.remove('active');

            document.body.classList.remove('modal-open');

        }

        closeButton.addEventListener('click', closeModal);

        modal.addEventListener('click', (e) => {

            if (e.target === modal) {

                closeModal();

            }

        });

        window.addEventListener('popstate', () => {

            if (modal.classList.contains('active')) {

                closeModal();

            }

        });

        menuButton.addEventListener('click', (e) => {
            if (
                fingerSelectorModal.classList.contains(
                    'active'
                )
            ) {
                return;
            }

            e.stopPropagation();

            menuPanel.classList.toggle('active');

            filtersModal.classList.remove('active');

        });

        filtersButton.addEventListener('click', (e) => {

            e.stopPropagation();

            filtersModal.classList.add('active');

            document.body.classList.add(
                'modal-open'
            );

        });

        function closeFiltersModal() {

            filtersModal.classList.remove(
                'active'
            );

            document.body.classList.remove(
                'modal-open'
            );

        }

        filtersCloseButton.addEventListener(
            'click',
            closeFiltersModal
        );

        filtersModal.addEventListener(
            'click',
            (e) => {

                if (e.target === filtersModal) {

                    closeFiltersModal();

                }

            }
        );
        playersRange.addEventListener(
            'input',
            (e) => {

                e.stopPropagation();

                currentPlayers =
                    Number(playersRange.value);

                playersLabel.innerText =
                    `${currentPlayers} jogadores`;

                renderGames();

            }
        );

        timeRange.addEventListener(
            'input',
            (e) => {

                e.stopPropagation();

                currentTime =
                    Number(timeRange.value);

                timeLabel.innerText =
                    `${currentTime} min`;

                renderGames();

            }
        );

        let activeTouches = new Map();

        let selectorTimeout = null;

        let selectedFingerId = null;
        let resultTimeout = null;
        let fingerSelectionLocked = false;
        let cooldownStarted = false;

        function resetFingerSelection() {

            clearTimeout(selectorTimeout);

            selectedFingerId = null;

            fingerLoading.classList.remove(
                'active'
            );

            document
                .querySelectorAll('.finger-point')
                .forEach(point => {

                    point.classList.remove(
                        'selected'
                    );

                });

        }

        function updateFingerStatus() {
            if (fingerSelectionLocked) {
                return;
            }

            const count =
                activeTouches.size;

            if (count <= 0) {

                if (selectedFingerId) {

                    clearTimeout(resultTimeout);

                    resultTimeout = setTimeout(() => {

                        if (activeTouches.size === 0) {

                            fingerArea.innerHTML = '';

                            fingerStatus.innerText =
                                'Coloque os dedos.';

                            resetFingerSelection();

                        }

                    }, 3000);

                    return;

                }

                fingerStatus.innerText =
                    'Coloque os dedos.';

                resetFingerSelection();

                return;

            }
            if (count === 1) {

                fingerStatus.innerText =
                    'Adicione mais um dedo.';

                resetFingerSelection();

                return;

            }
            fingerStatus.innerText =
                `${count} dedo${count > 1 ? 's' : ''} reconhecido${count > 1 ? 's' : ''}`;

            resetFingerSelection();

            fingerLoading.classList.add(
                'active'
            );

            selectorTimeout = setTimeout(() => {

                const keys =
                    Array.from(
                        activeTouches.keys()
                    );

                if (keys.length <= 0) {
                    return;
                }

                const randomId =
                    keys[
                    Math.floor(
                        Math.random() * keys.length
                    )
                    ];

                selectedFingerId =
                    randomId;
                fingerSelectionLocked = true;

                clearTimeout(resultTimeout);

                resultTimeout = setTimeout(() => {

                    cooldownStarted = false;

                    fingerSelectionLocked = false;

                    selectedFingerId = null;

                    activeTouches.clear();

                    fingerArea.innerHTML = '';

                    fingerStatus.innerText =
                        'Coloque os dedos.';

                    resetFingerSelection();

                }, 3000);

                fingerLoading.classList.remove(
                    'active'
                );

                const selectedElement =
                    document.querySelector(
                        `[data-touch-id="${randomId}"]`
                    );

                if (selectedElement) {

                    selectedElement.classList.add(
                        'selected'
                    );
                    fingerStatus.innerText =
                        'Dedo selecionado!';

                }

            }, 3000);

        }

        function createFingerPoint(id, x, y) {

            const point =
                document.createElement('div');

            point.className =
                'finger-point';

            point.dataset.touchId = id;

            point.style.left = `${x}px`;
            point.style.top = `${y}px`;

            fingerArea.appendChild(point);

        }

        function moveFingerPoint(id, x, y) {

            const point =
                document.querySelector(
                    `[data-touch-id="${id}"]`
                );

            if (!point) {
                return;
            }

            point.style.left = `${x}px`;
            point.style.top = `${y}px`;

        }

        function removeFingerPoint(id) {

            const point =
                document.querySelector(
                    `[data-touch-id="${id}"]`
                );

            if (point) {
                point.remove();
            }

        }
        let scrollTimeout = null;

        window.addEventListener(
            'scroll',
            () => {

                if (
                    modal.classList.contains('active') ||
                    diceModal.classList.contains('active') ||
                    timerModal.classList.contains('active') ||
                    fingerSelectorModal.classList.contains('active') ||
                    filtersModal.classList.contains('active')
                ) {
                    return;
                }

                document
                    .querySelector('.floating-menu')
                    .classList.add('hidden');

                clearTimeout(scrollTimeout);

                scrollTimeout = setTimeout(() => {

                    document
                        .querySelector('.floating-menu')
                        .classList.remove('hidden');

                }, 120);

            },
            { passive: true }
        );
        fingerArea.addEventListener(
            'touchstart',
            (e) => {
                if (fingerSelectionLocked) {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();

                for (const touch of e.changedTouches) {

                    const rect =
                        fingerArea.getBoundingClientRect();

                    const x =
                        touch.clientX - rect.left;

                    const y =
                        touch.clientY - rect.top;

                    activeTouches.set(
                        touch.identifier,
                        { x, y }
                    );

                    createFingerPoint(
                        touch.identifier,
                        x,
                        y
                    );

                }

                updateFingerStatus();

            }
        );

        fingerArea.addEventListener(
            'touchmove',
            (e) => {
                if (fingerSelectionLocked) {
                    return;
                }
                e.preventDefault();
                e.stopPropagation();

                for (const touch of e.changedTouches) {

                    const rect =
                        fingerArea.getBoundingClientRect();

                    const x =
                        touch.clientX - rect.left;

                    const y =
                        touch.clientY - rect.top;

                    activeTouches.set(
                        touch.identifier,
                        { x, y }
                    );

                    moveFingerPoint(
                        touch.identifier,
                        x,
                        y
                    );

                }

            }
        );

        fingerArea.addEventListener(
            'touchend',
            (e) => {

                e.preventDefault();
                e.stopPropagation();

                if (fingerSelectionLocked) {
                    return;
                }

                for (const touch of e.changedTouches) {

                    activeTouches.delete(
                        touch.identifier
                    );

                    removeFingerPoint(
                        touch.identifier
                    );

                }

                updateFingerStatus();

            }
        );
        fingerSelectorButton.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();

                clearTimeout(resultTimeout);
                clearTimeout(selectorTimeout);

                fingerSelectionLocked = false;

                selectedFingerId = null;

                activeTouches.clear();
                cooldownStarted = false;

                fingerArea.innerHTML = '';

                resetFingerSelection();

                fingerStatus.innerText =
                    'Coloque os dedos.';

                fingerSelectorModal.classList.add(
                    'active'
                );

                menuPanel.classList.remove(
                    'active'
                );

                filtersPanel.classList.remove(
                    'active'
                );

                document.body.classList.add(
                    'modal-open'
                );

            }
        );

        function closeFingerSelector() {

            clearTimeout(resultTimeout);
            clearTimeout(selectorTimeout);

            fingerSelectionLocked = false;

            selectedFingerId = null;
            cooldownStarted = false;

            activeTouches.clear();

            fingerArea.innerHTML = '';

            resetFingerSelection();


            fingerStatus.innerText =
                'Coloque os dedos.';

            fingerSelectorModal.classList.remove(
                'active'
            );

            document.body.classList.remove(
                'modal-open'
            );

        }

        closeFingerSelectorButton.addEventListener(
            'click',
            closeFingerSelector
        );

        fingerSelectorModal.addEventListener(
            'click',
            (e) => {

                if (
                    e.target === fingerSelectorModal
                ) {

                    return;

                }

                e.stopPropagation();

            }
        );
        document.addEventListener('click', (e) => {
            if (
                fingerSelectorModal.classList.contains(
                    'active'
                )
            ) {
                return;
            }

            const clickedInsideMenu =
                e.target.closest('.floating-menu');

            if (!clickedInsideMenu) {

                menuPanel.classList.remove('active');

                filtersModal.classList.remove('active');

            }

        });

        clearFiltersButton.addEventListener('click', (e) => {

            e.stopPropagation();

            currentPlayers = null;

            currentTime = null;

            selectedMechanics = [];

            playersRange.value = globalMinPlayers;

            timeRange.value = globalMaxTime;

            playersLabel.innerText =
                '? jogadores';

            timeLabel.innerText =
                '? min';

            renderGames();

            renderMechanicsFilters();

            updateFiltersUI();

        });

        catalogButton.addEventListener('click', () => {

            location.reload();

        });

        diceButton.addEventListener('click', (e) => {

            e.stopPropagation();

            diceModal.classList.add('active');

            document.body.classList.add('modal-open');

        });

        function closeDiceModal() {

            diceModal.classList.remove('active');

            document.body.classList.remove('modal-open');

        }

        diceCloseButton.addEventListener(
            'click',
            closeDiceModal
        );

        diceModal.addEventListener('click', (e) => {

            if (e.target === diceModal) {

                closeDiceModal();

            }

        });
        diceRollButton.addEventListener('click', () => {

            let max =
                Number(diceInput.value);

            if (!max || max < 2) {

                max = 6;

                diceInput.value = 6;

            }

            diceResult.innerHTML =
                '<div class="dice-spinner"></div>';

            diceRollButton.classList.add(
                'dice-loading'
            );

            diceRollButton.innerText =
                'Rolando...';

            setTimeout(() => {

                const result =
                    Math.floor(Math.random() * max) + 1;

                diceResult.innerHTML =
                    result;

                diceRollButton.classList.remove(
                    'dice-loading'
                );

                diceRollButton.innerText =
                    'Lançar Dado!';

            }, 1000);

        });


        uncheckAllMechanics.addEventListener(
            'click',
            () => {

                selectedMechanics = [];

                renderMechanicsFilters();

                renderGames();

            }
        );

        let timerInterval = null;

        let totalSeconds = 90;

        let timerRunning = false;
        let timerPaused = false;

        function updateTimerDisplay() {

            const min =
                String(Math.floor(totalSeconds / 60))
                    .padStart(2, '0');

            const sec =
                String(totalSeconds % 60)
                    .padStart(2, '0');

            timerDisplay.innerText =
                `${min}:${sec}`;

        }

        function syncInputs() {

            minutesInput.value =
                Math.floor(totalSeconds / 60);

            secondsInput.value =
                totalSeconds % 60;

        }
        function updateTimerButtons() {

            if (timerRunning) {

                startTimerButton.style.display =
                    'none';

                pauseTimerButton.style.display =
                    'block';

                stopTimerButton.style.display =
                    'block';

                pauseTimerButton.innerText =
                    'Pausar';

                timerInputs.style.display =
                    'none';

            } else if (timerPaused) {

                startTimerButton.style.display =
                    'none';

                pauseTimerButton.style.display =
                    'block';

                stopTimerButton.style.display =
                    'block';

                pauseTimerButton.innerText =
                    'Reiniciar';

                timerInputs.style.display =
                    'none';

            } else {

                startTimerButton.style.display =
                    'block';

                pauseTimerButton.style.display =
                    'none';

                stopTimerButton.style.display =
                    'none';

                timerInputs.style.display =
                    'flex';

            }

        }
        function resetTimer() {
            timerDisplay.classList.remove(
                'timer-finished'
            );

            clearInterval(timerInterval);

            timerRunning = false;

            totalSeconds =
                (
                    Number(minutesInput.value) * 60
                ) +
                Number(secondsInput.value);

            updateTimerDisplay();

            updateTimerButtons();

        }

        timerButton.addEventListener('click', () => {

            timerModal.classList.add('active');

            document.body.classList.add('modal-open');

        });

        function closeTimerModal() {

            timerModal.classList.remove('active');

            document.body.classList.remove('modal-open');

        }

        timerCloseButton.addEventListener(
            'click',
            closeTimerModal
        );

        timerModal.addEventListener('click', (e) => {

            if (e.target === timerModal) {

                closeTimerModal();

            }

        });

        minutesInput.addEventListener('input', () => {

            if (minutesInput.value > 59) {
                minutesInput.value = 59;
            }

            if (minutesInput.value < 0) {
                minutesInput.value = 0;
            }

            resetTimer();

        });

        secondsInput.addEventListener('input', () => {

            if (secondsInput.value > 59) {
                secondsInput.value = 59;
            }

            if (secondsInput.value < 0) {
                secondsInput.value = 0;
            }

            resetTimer();

        });

        startTimerButton.addEventListener('click', () => {
            timerDisplay.classList.remove(
                'timer-finished'
            );

            if (timerRunning) {
                return;
            }
            if (totalSeconds <= 0) {

                totalSeconds =
                    (
                        Number(minutesInput.value) * 60
                    ) +
                    Number(secondsInput.value);

                updateTimerDisplay();

            }

            timerRunning = true;

            updateTimerButtons();

            timerInterval = setInterval(() => {

                if (totalSeconds <= 0) {

                    clearInterval(timerInterval);

                    timerRunning = false;
                    timerPaused = false;

                    totalSeconds = 0;

                    updateTimerDisplay();

                    timerDisplay.classList.add(
                        'timer-finished'
                    );

                    startTimerButton.style.display =
                        'block';

                    pauseTimerButton.style.display =
                        'none';

                    stopTimerButton.style.display =
                        'none';

                    timerInputs.style.display =
                        'flex';

                    return;

                }

                totalSeconds--;

                updateTimerDisplay();

            }, 1000);

        });

        pauseTimerButton.addEventListener('click', () => {

            if (timerRunning) {

                clearInterval(timerInterval);

                timerRunning = false;
                timerPaused = true;

                updateTimerButtons();

            } else {

                timerRunning = true;
                timerPaused = false;

                updateTimerButtons();

                timerInterval = setInterval(() => {

                    if (totalSeconds <= 0) {

                        clearInterval(timerInterval);

                        timerRunning = false;
                        timerPaused = false;

                        totalSeconds = 0;

                        updateTimerDisplay();

                        timerDisplay.classList.add(
                            'timer-finished'
                        );

                        startTimerButton.style.display =
                            'block';

                        pauseTimerButton.style.display =
                            'none';

                        stopTimerButton.style.display =
                            'none';

                        timerInputs.style.display =
                            'flex';

                        return;

                    }

                    totalSeconds--;

                    updateTimerDisplay();

                }, 1000);

            }

        });

        stopTimerButton.addEventListener('click', () => {

            clearInterval(timerInterval);

            timerRunning = false;
            timerPaused = false;

            totalSeconds =
                (
                    Number(minutesInput.value) * 60
                ) +
                Number(secondsInput.value);

            updateTimerDisplay();

            updateTimerButtons();

        });

        updateTimerDisplay();

        updateTimerButtons();
        fingerArea.addEventListener(
            'contextmenu',
            (e) => {

                e.preventDefault();

            }
        );
    </script>



</body>

</html>
