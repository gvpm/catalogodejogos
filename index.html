<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#121212">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma" content="no-cache">

    <meta http-equiv="Expires" content="0">

    <title>Catálogo de Jogos</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg?v=1">

    <link rel="apple-touch-icon" href="icon.svg?v=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        button i {
            pointer-events: none;
        }

        body {
            background: #121212;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .games-container {

            display: grid;

            grid-template-columns:
                repeat(3, 220px);

            justify-content: center;

            gap: 20px;

        }

        .game-card {
            position: relative;

            background: #1e1e1e;
            border-radius: 16px;
            overflow: hidden;

            transition: .2s ease;

            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, .05);

            box-shadow:
                0 4px 18px rgba(0, 0, 0, .28);
        }

        .game-card:hover {

            transform:
                translateY(-4px) scale(1.02);

            box-shadow:
                0 12px 28px rgba(0, 0, 0, .45);

        }

        .game-image {
            width: 100%;
            aspect-ratio: 1 / 1.35;
            object-fit: cover;
            background: #2b2b2b;
        }

        .game-info {
            padding: 12px;
            text-align: center;
        }

        .game-title {
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.3;
        }

        .game-meta {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 6px;

            margin-top: 8px;

            color: rgba(255, 255, 255, .68);

            font-size: .82rem;

            font-weight: 500;

            letter-spacing: .2px;

        }

        .game-meta i {

            font-size: .78rem;

            opacity: .9;

        }

        .meta-item {

            display: flex;

            align-items: center;

            gap: 5px;

        }

        .favorite-button {
            position: absolute;

            top: 10px;
            left: 10px;
            width: 38px;
            height: 38px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, .38);

            color: white;

            font-size: 1.2rem;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 10;

            backdrop-filter: blur(1px);

            transition: .2s ease;
        }

        .favorite-button.active {
            color: #ff3b5c;
        }

        .modal-favorite-button {
            position: absolute;

            top: 14px;
            left: 14px;

            width: 46px;
            height: 46px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, .42);

            color: white;

            font-size: 1.4rem;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 30;

            backdrop-filter: blur(1px);

            transition: .2s ease;
        }

        .modal-rulebook-button {

            position: absolute;

            bottom: 14px;
            right: 14px;

            width: 46px;
            height: 46px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, .42);

            color: white;

            font-size: 1.3rem;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 30;

            backdrop-filter: blur(3px);

            transition: .2s ease;
        }

        .modal-tools-button {
            position: absolute;
            bottom: 14px;
            left: 14px;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .42);
            color: white;
            font-size: 1.25rem;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            backdrop-filter: blur(3px);
            transition: .2s ease;
        }

        .modal-tools-button:hover,
        .modal-rulebook-button:hover {
            background: rgba(0, 0, 0, .82);
            transform: translateY(-1px);
        }


        .modal-favorite-button.active {
            color: #ff3b5c;
        }

        .favorite-button i,
        .modal-favorite-button i {
            transform: translateY(1px);
        }

        .modal {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .92);

            opacity: 0;
            pointer-events: none;

            transition: .2s ease;

            z-index: 999;

            overflow-y: auto;

            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            position: relative;

            max-width: 700px;
            width: 100%;

            margin: 40px auto;

            background: #1b1b1b;

            border-radius: 20px;

            overflow: visible;
            animation: zoom .2s ease;
        }

        .close-button {
            position: absolute;

            top: 14px;
            right: 14px;

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, .42);

            color: white;

            font-size: 1.4rem;

            cursor: pointer;

            z-index: 30;

            display: flex;
            align-items: center;
            justify-content: center;

            backdrop-filter: blur(1px);

            transition: .2s ease;
        }

        .close-button:hover {
            background: rgba(0, 0, 0, .95);
        }

        .modal-image {
            width: 100%;
            max-height: 75vh;

            object-fit: contain;

            background: #222;
        }

        .modal-image-wrapper {

            position: relative;

        }

        .modal-body {
            padding: 20px;
        }

        .modal-title {
            text-align: center;

            margin-top: 10px;

            font-size: 1.3rem;
            font-weight: bold;
        }

        .modal-title-link {
            color: inherit;
            text-decoration: none;
            transition: .18s ease;
        }

        .modal-title-link:hover {
            color: #bbb;
            text-decoration: none;
        }

        .modal-title-link:visited,
        .modal-title-link:active {
            color: inherit;
            text-decoration: none;
        }

        .modal-meta {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            margin-top: 12px;

            color: rgba(255, 255, 255, .72);

            font-size: .95rem;

            font-weight: 500;

        }

        .modal-meta {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

        }

        .modal-meta-top {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

        }

        .modal-meta .meta-item {

            display: flex;

            align-items: center;

            gap: 6px;

        }

        .modal-rules {
            margin-top: 8px;

            line-height: 1.7;

            color: #ddd;

            white-space: pre-line;

            text-align: left;
        }

        .modal-rules h3 {
            margin-top: 18px;
            margin-bottom: 8px;

            color: white;
        }

        body.modal-open {
            overflow: hidden;
        }

        @keyframes zoom {
            from {
                transform: scale(.92);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .games-count {
            margin-top: 28px;

            text-align: center;

            color: rgba(255, 255, 255, .6);

            font-size: .95rem;
        }

        .floating-menu {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9999;
            transition:
                opacity .22s ease,
                transform .22s ease;
        }

        .floating-menu.hidden {

            opacity: 0;

            transform:
                translateY(20px) scale(.92);
            pointer-events: none;

        }

        .menu-button {
            width: 58px;
            height: 58px;

            border: none;
            border-radius: 50%;

            background: rgba(31, 31, 31, 0.849);

            backdrop-filter: blur(3px);

            color: white;

            font-size: 1.5rem;

            cursor: pointer;

            box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
        }

        .random-game-button {
            position: absolute;
            right: 74px;
            bottom: 0;
            opacity: 0;
            pointer-events: none;
            transform: translateX(12px) scale(.88);
            transition: .2s ease;
        }

        .menu-panel.active ~ .random-game-button {
            opacity: 1;
            pointer-events: all;
            transform: translateX(0) scale(1);
        }

        .random-game-button:hover {
            background: rgba(48, 48, 48, .95);
            transform: translateX(0) scale(1.05);
        }



        .menu-panel {
            position: absolute;

            right: 0;
            bottom: 74px;

            width: 240px;
            background: rgba(24, 24, 24, .88);

            border-radius: 18px;

            padding: 12px;

            opacity: 0;
            pointer-events: none;

            transform: translateY(10px);

            transition: .2s ease;
            backdrop-filter: blur(12px);

            display: flex;

            flex-direction: column;

            gap: 10px;

        }

        .menu-panel.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .menu-option {

            width: 100%;

            border: none;

            background: rgba(255, 255, 255, .04);

            color: white;

            padding: 14px 16px;

            border-radius: 16px;

            cursor: pointer;

            font-size: .97rem;

            font-weight: 600;

            letter-spacing: .2px;

            text-align: left;

            display: flex;

            align-items: center;

            gap: 12px;

            transition: .18s ease;

            backdrop-filter: blur(3px);
            white-space: nowrap;

        }

        .menu-option:hover {

            background: rgba(255, 255, 255, .08);

            transform: translateY(-1px);

        }

        .clear-filters-button {
            margin-top: 10px;

            background: #5a1d1d;

            color: #ff8d8d;

            display: none;
        }

        .clear-filters-button.active {
            display: block;
        }



        .filters-title {
            font-size: 1rem;
            font-weight: bold;

            margin-bottom: 14px;
        }

        .range-values {
            display: flex;
            justify-content: center;

            margin-bottom: 10px;

            color: #aaa;
        }

        .range-group {
            position: relative;
        }

        .range-group input {
            width: 100%;
        }

        .dice-modal {

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .92);

            z-index: 99999;

            display: flex;

            align-items: flex-start;

            justify-content: center;

            overflow-y: auto;

            padding: 24px 20px;

            opacity: 0;
            pointer-events: none;

            transition: .2s ease;

            padding: 20px;

        }

        .filters-modal {
            background: rgba(0, 0, 0, .55);
        }

        .dice-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .dice-content {

            position: relative;

            width: 100%;
            max-width: 520px;

            background: #1b1b1b;

            border-radius: 24px;

            padding: 32px 24px;

            animation: zoom .2s ease;

            margin: auto 0;

        }

        .dice-icon {

            font-size: 4rem;

            text-align: center;

            margin-bottom: 12px;

        }

        .dice-result {

            text-align: center;

            font-size: 4rem;

            font-weight: bold;

            margin-bottom: 18px;

        }

        .timer-finished {
            color: #ff4d6d;
        }

        .dice-input-wrapper {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 24px;

        }

        .dice-label {

            font-size: 2rem;

            font-weight: bold;

            color: #aaa;

        }

        .dice-input {

            width: 120px;

            background: #262626;

            border: none;

            border-radius: 16px;

            padding: 16px;

            text-align: center;

            color: white;

            font-size: 2rem;

            outline: none;

        }

        .dice-roll-button {

            width: 100%;

            border: none;

            border-radius: 18px;

            background: #2f2f2f;

            color: white;

            padding: 18px;

            font-size: 1.1rem;

            cursor: pointer;

            transition: .2s ease;

        }

        .dice-roll-button:hover {
            background: #3a3a3a;
        }

        .dice-loading {

            opacity: .7;

            pointer-events: none;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .dice-spinner {

            width: 70px;
            height: 70px;

            border-radius: 50%;

            border: 6px solid rgba(255, 255, 255, .15);

            border-top-color: white;

            margin: 0 auto 18px auto;

            animation: spin .8s linear infinite;

        }

        .timer-inputs {

            display: flex;

            justify-content: center;

            gap: 18px;

            margin-bottom: 24px;

        }

        .timer-group {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

        }

        .timer-label {

            color: #aaa;

            font-size: .95rem;

        }

        .timer-buttons {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }

        .mechanics-inline {
            width: 100%;
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            flex-wrap: wrap;

            margin-top: 8px;

            color: rgba(255, 255, 255, .72);

            font-size: .95rem;

            font-weight: 500;

        }

        .mechanics-inline i {

            font-size: .92rem;

            color: rgba(255, 255, 255, .82);

        }

        .mechanics-inline-list {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

        }

        .mechanic-inline-tag {

            color: rgba(255, 255, 255, .62);

            text-decoration: none;

            font-size: .72rem;

            line-height: 1;

            transition: .15s ease;

        }

        .mechanic-inline-tag::after {

            content: ",";

            margin-right: 5px;

            opacity: .45;

        }

        .mechanic-inline-tag:last-child::after {

            display: none;

        }

        .mechanic-inline-tag:hover {

            color: white;

        }

        .mechanic-inline-tag:visited,
        .mechanic-inline-tag:active {

            color: rgba(255, 255, 255, .62);

        }

        .mechanics-filters-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

            max-height: 320px;

            overflow-y: auto;

            padding-right: 4px;

        }

        .mechanics-filter-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            color: rgba(255, 255, 255, .82);

            font-size: .9rem;

        }

        .mechanics-filter-left {

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .mechanics-filter-count {

            color: rgba(255, 255, 255, .4);

            font-size: .82rem;

        }

        .mechanics-action-button {

            border: none;

            background: rgba(255, 255, 255, .06);

            color: rgba(255, 255, 255, .82);

            border-radius: 10px;

            padding: 6px 10px;

            cursor: pointer;

            font-size: .78rem;

            transition: .15s ease;

        }

        .mechanics-action-button:hover {

            background: rgba(255, 255, 255, .12);

        }

        @media (max-width:700px) {

            body {
                padding: 16px;
            }

            .games-container {

                grid-template-columns:
                    repeat(2, calc(50vw - 24px)) !important;

                gap: 14px !important;

                justify-content: center !important;

            }

            .game-card {
                width: 100%;
            }

            .game-title {
                font-size: 1rem;
            }

            .game-info {
                padding: 14px;
            }

            .menu-button {
                width: 86px !important;
                height: 86px !important;

                font-size: 2rem !important;
            }

            .random-game-button {
                right: 100px;
            }

            .favorite-button {

                width: 42px !important;
                height: 42px !important;

                font-size: 1.5rem !important;
            }

            .modal-favorite-button {

                width: 52px !important;
                height: 52px !important;

                font-size: 1.8rem !important;
            }

            .modal-rulebook-button {

                width: 52px !important;
                height: 52px !important;

                font-size: 1.8rem !important;
            }

            .modal-tools-button {
                width: 52px !important;
                height: 52px !important;
                font-size: 1.6rem !important;
            }


            .close-button {
                width: 52px !important;
                height: 52px !important;

                font-size: 1.8rem !important;
            }

            .menu-panel {

                width: 250px !important;
                bottom: 96px !important;
            }

            .menu-option {

                padding: 20px !important;

                font-size: 1.08rem !important;
            }

            .menu-option i {

                width: 20px;

                text-align: center;

                opacity: .92;

            }

            .range-group input {

                height: 40px !important;
            }

        }

        .finger-status {

            text-align: center;

            font-size: 1.15rem;

            margin-top: 38px;

            margin-bottom: 10px;

            color: white;

            min-height: 32px;
        }

        .finger-area {

            position: relative;

            width: 100%;
            height: 340px;

            margin-top: 20px;

            border-radius: 18px;

            background: #262626;

            overflow: hidden;

            touch-action: none;

            -webkit-touch-callout: none;

            -webkit-user-select: none;
            user-select: none;

            -webkit-tap-highlight-color:
                transparent;
        }

        .finger-point {

            position: absolute;

            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: rgba(255, 255, 255, .08);

            border: 2px solid rgba(255, 255, 255, .22);

            transform: translate(-50%, -50%);

            transition: .15s ease;
        }

        .finger-point.selected {

            background: #4dffac;

            animation: fingerBlink .8s infinite;
        }

        .finger-loading {

            text-align: center;

            margin-top: 18px;

            font-size: 2rem;

            opacity: 0;

            transition: .2s ease;
        }

        .finger-loading.active {

            opacity: 1;

        }

        .finger-loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes fingerBlink {

            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: .55;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .game-tools-content {
            max-width: 680px;
            padding: 30px 22px 24px;
        }

        .game-tools-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .game-tools-header i {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .game-tools-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .game-tools-subtitle {
            margin-top: 5px;
            color: #aaa;
            font-size: .92rem;
        }

        .game-tools-sections {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .tool-section {
            background: #232323;
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 20px;
            padding: 18px;
        }

        .tool-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .tool-section-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .tool-icon-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 13px;
            background: #343434;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .tool-icon-button:hover {
            background: #414141;
        }

        .points-counters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .point-counter {
            --counter-color: #4f8cff;
            position: relative;
            overflow: hidden;
            background: #191919;
            border: 1px solid color-mix(in srgb, var(--counter-color) 55%, transparent);
            border-radius: 18px;
            padding: 14px;
        }

        .point-counter::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                color-mix(in srgb, var(--counter-color) 20%, transparent),
                transparent 60%
            );
            pointer-events: none;
        }

        .point-counter-controls {
            position: relative;
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            align-items: center;
            gap: 8px;
        }

        .point-counter-button {
            height: 48px;
            border: none;
            border-radius: 14px;
            background: color-mix(in srgb, var(--counter-color) 28%, #222);
            color: white;
            font-size: 1.35rem;
            font-weight: 700;
            cursor: pointer;
        }

        .point-counter-input {
            width: 100%;
            min-width: 0;
            border: none;
            background: transparent;
            color: white;
            font-size: 2.25rem;
            font-weight: 800;
            text-align: center;
            outline: none;
            appearance: textfield;
        }

        .point-counter-input::-webkit-inner-spin-button,
        .point-counter-input::-webkit-outer-spin-button {
            appearance: none;
            margin: 0;
        }

        .global-points-content {

        const pointCounterColors = [

        const GLOBAL_POINTS_STORAGE_KEY =
            'globalPointsState:v1';

        function createDefaultGlobalPointsState() {

            return {
                counters: ['#4f8cff', '#35c98b'].map(
                    color => ({
                        value: 0,
                        color,
                        name: ''
                    })
                )
            };

        }

        function normalizeGlobalPointsState(savedState) {

            if (
                !savedState ||
                !Array.isArray(savedState.counters) ||
                savedState.counters.length < 1
            ) {
                return createDefaultGlobalPointsState();
            }

            return {
                counters: savedState.counters.map(
                    (counter, index) => {

                        const value = Number(counter.value);

                        return {
                            value: Number.isFinite(value)
                                ? value
                                : 0,
                            color:
                                typeof counter.color === 'string' &&
                                /^#[0-9a-f]{6}$/i.test(
                                    counter.color
                                )
                                    ? counter.color
                                    : pointCounterColors[
                                        index %
                                        pointCounterColors.length
                                    ],
                            name:
                                typeof counter.name === 'string'
                                    ? counter.name
                                    : ''
                        };

                    }
                )
            };

        }

        function loadGlobalPointsState() {

            try {

            globalPointsState.counters =

                    (_, index) =>
                        globalPointsState.counters[index] ||

                            value: 0,
                            color: newColors[index],
                            name: ''
                        }
                );

            saveGlobalPointsState(globalPointsState);

        function getToolsConfig(gameId) {

            return toolsData.find(
                item => item.id === gameId
            ) || null;

        }

        function getToolsStorageKey(gameId) {

            return `gameToolsState:v1:${gameId}`;

        }

        function createPointColors(count) {

            const shuffled = [...pointCounterColors]
                .sort(() => Math.random() - .5);

            return Array.from(
                { length: count },
                (_, index) =>
                    shuffled[index % shuffled.length]
            );

        }

        function createDefaultToolsState(tools) {

            const state = {};

            const cardTool = tools.find(
                tool => tool.type === 'pick_a_card'
            );

            if (cardTool) {

                state.pick_a_card = {
                    remaining: cardTool.cards.map(
                        (_, index) => index
                    ),
                    discarded: [],
                    current: null
                };

            }

            const pointsTool = tools.find(
                tool => tool.type === 'points_counter'
            );

            if (pointsTool) {

                const count = Math.max(
                    0,
                    Number(pointsTool.count) || 0
                );

                state.points_counter = {
                    values: Array(count).fill(0),
                    colors: createPointColors(count)
                };

            }

            return state;

        }

        function normalizeToolsState(tools, savedState) {

            const state = createDefaultToolsState(tools);

            const cardTool = tools.find(
                tool => tool.type === 'pick_a_card'
            );

            if (
                cardTool &&
                savedState &&
                savedState.pick_a_card
            ) {

                const cardCount = cardTool.cards.length;
                const validIndices = new Set(
                    Array.from(
                        { length: cardCount },
                        (_, index) => index
                    )
                );

                const discarded = Array.isArray(
                    savedState.pick_a_card.discarded
                )
                    ? savedState.pick_a_card.discarded
                        .filter(index =>
                            Number.isInteger(index) &&
                            validIndices.has(index)
                        )
                    : [];

                const discardedSet = new Set(discarded);
                const remaining = Array.isArray(
                    savedState.pick_a_card.remaining
                )
                    ? savedState.pick_a_card.remaining
                        .filter(index =>
                            Number.isInteger(index) &&
                            validIndices.has(index) &&
                            !discardedSet.has(index)
                        )
                    : [];

                const used = new Set([
                    ...discarded,
                    ...remaining
                ]);

                for (
                    let index = 0;
                    index < cardCount;
                    index++
                ) {

                    if (!used.has(index)) {
                        remaining.push(index);
                    }

                }

                const current =
                    Number.isInteger(
                        savedState.pick_a_card.current
                    ) &&
                    validIndices.has(
                        savedState.pick_a_card.current
                    )
                        ? savedState.pick_a_card.current
                        : null;

                state.pick_a_card = {
                    remaining: [...new Set(remaining)],
                    discarded: [...new Set(discarded)],
                    current
                };

            }

            const pointsTool = tools.find(
                tool => tool.type === 'points_counter'
            );

            if (
                pointsTool &&
                savedState &&
                savedState.points_counter
            ) {

                const count = Math.max(
                    0,
                    Number(pointsTool.count) || 0
                );
                const savedValues = Array.isArray(
                    savedState.points_counter.values
                )
                    ? savedState.points_counter.values
                    : [];
                const savedColors = Array.isArray(
                    savedState.points_counter.colors
                )
                    ? savedState.points_counter.colors
                    : [];

                state.points_counter.values =
                    Array.from(
                        { length: count },
                        (_, index) => {

                            const value =
                                Number(savedValues[index]);

                            return Number.isFinite(value)
                                ? value
                                : 0;

                        }
                    );

                state.points_counter.colors =
                    Array.from(
                        { length: count },
                        (_, index) =>
                            savedColors[index] ||
                            state.points_counter.colors[index]
                    );

            }

            return state;

        }

        function loadToolsState(gameId, tools) {

            let savedState = null;

            try {

                savedState = JSON.parse(
                    localStorage.getItem(
                        getToolsStorageKey(gameId)
                    ) || 'null'
                );

            } catch (error) {

                savedState = null;

            }

            return normalizeToolsState(
                tools,
                savedState
            );

        }

        function saveToolsState(gameId, state) {

            localStorage.setItem(
                getToolsStorageKey(gameId),
                JSON.stringify(state)
            );

        }

        function renderGameTools(game) {

            const config = getToolsConfig(game.id);

            if (!config || !config.tools.length) {
                return;
            }

            currentGameWithTools = game;
            gameToolsTitle.innerText =
                `${game.title} · Ferramentas`;
            gameToolsSections.innerHTML = '';

            const state = loadToolsState(
                game.id,
                config.tools
            );

            saveToolsState(game.id, state);

            const orderedTools = [...config.tools]
                .sort((a, b) => {

                    if (a.type === 'points_counter') {
                        return -1;
                    }

                    if (b.type === 'points_counter') {
                        return 1;
                    }

                    return 0;

                });

            orderedTools.forEach(tool => {

                const section =
                    document.createElement('section');
                section.className = 'tool-section';

                if (tool.type === 'points_counter') {

                    renderPointsTool(
                        section,
                        game,
                        config.tools,
                        state,
                        tool
                    );

                }

                if (tool.type === 'pick_a_card') {

                    renderPickCardTool(
                        section,
                        game,
                        config.tools,
                        state,
                        tool
                    );

                }

                if (section.children.length > 0) {

                    gameToolsSections.appendChild(
                        section
                    );

                }

            });

        }

        function renderMechanicsFilters() {

            mechanicsFiltersList.innerHTML = '';

            const usedMechanicIds = [

                ...new Set(

                    allGames.flatMap(
                        game => game.mechanics || []
                    )

                )

            ];

            mechanicsData

                .filter(mechanic =>
                    usedMechanicIds.includes(mechanic.id)
                )

                .sort((a, b) =>
                    a.name.localeCompare(
                        b.name,
                        'pt-BR',
                        { sensitivity: 'base' }
                    )
                )

                .forEach(mechanic => {

                    const gamesCount = allGames.filter(game => {

                        if (
                            currentPlayers !== null &&
                            (
                                currentPlayers < game.minPlayers ||
                                currentPlayers > game.maxPlayers
                            )
                        ) {
                            return false;
                        }

                        if (
                            currentTime !== null &&
                            game.time > currentTime
                        ) {
                            return false;
                        }

                        const otherSelectedMechanics =
                            selectedMechanics.filter(
                                id => id !== mechanic.id
                            );

                        if (
                            !otherSelectedMechanics.every(id =>
                                game.mechanics?.includes(id)
                            )
                        ) {
                            return false;
                        }

                        return game.mechanics?.includes(mechanic.id);

                    }).length;

                    const item =
                        document.createElement('label');

                    item.className =
                        'mechanics-filter-item';

                    item.innerHTML = `

                <div class="mechanics-filter-left">

                    <input
                        type="checkbox"
                        value="${mechanic.id}"
                        ${selectedMechanics.includes(mechanic.id)
                            ? 'checked'
                            : ''
                        }
                    >

                    <span>
                        ${mechanic.name}
                    </span>

                </div>

                <span class="mechanics-filter-count">
                    (${gamesCount})
                </span>

            `;

                    const checkbox =
                        item.querySelector('input');

                    checkbox.addEventListener(
                        'change',
                        () => {

                            const id =
                                Number(checkbox.value);

                            if (checkbox.checked) {

                                if (
                                    !selectedMechanics.includes(id)
                                ) {

                                    selectedMechanics.push(id);

                                }

                            } else {

                                selectedMechanics =
                                    selectedMechanics.filter(
                                        m => m !== id
                                    );

                            }

                            renderGames();

                        }
                    );

                    mechanicsFiltersList.appendChild(item);

                });

        }

        function resetFingerSelection() {

            clearTimeout(selectorTimeout);

            selectedFingerId = null;

            fingerLoading.classList.remove(
                'active'
            );

            document
                .querySelectorAll('.finger-point')
                .forEach(point => {

                    point.classList.remove(
                        'selected'
                    );

                });

        }

        function updateFingerStatus() {
            if (fingerSelectionLocked) {
                return;
            }

            const count =
                activeTouches.size;

            if (count <= 0) {

                if (selectedFingerId) {

                    clearTimeout(resultTimeout);

                    resultTimeout = setTimeout(() => {

                        if (activeTouches.size === 0) {

                            fingerArea.innerHTML = '';

                            fingerStatus.innerText =
                                'Coloque os dedos.';

                            resetFingerSelection();

                        }

                    }, 3000);

                    return;

                }

                fingerStatus.innerText =
                    'Coloque os dedos.';

                resetFingerSelection();

                return;

            }
            if (count === 1) {

                fingerStatus.innerText =
                    'Adicione mais um dedo.';

                resetFingerSelection();

                return;

            }
            fingerStatus.innerText =
                `${count} dedo${count > 1 ? 's' : ''} reconhecido${count > 1 ? 's' : ''}`;

            resetFingerSelection();

            fingerLoading.classList.add(
                'active'
            );

            selectorTimeout = setTimeout(() => {

                const keys =
                    Array.from(
                        activeTouches.keys()
                    );

                if (keys.length <= 0) {
                    return;
                }

                const randomId =
                    keys[
                    Math.floor(
                        Math.random() * keys.length
                    )
                    ];

                selectedFingerId =
                    randomId;
                fingerSelectionLocked = true;

                clearTimeout(resultTimeout);

                resultTimeout = setTimeout(() => {

                    cooldownStarted = false;

                    fingerSelectionLocked = false;

                    selectedFingerId = null;

                    activeTouches.clear();

                    fingerArea.innerHTML = '';

                    fingerStatus.innerText =
                        'Coloque os dedos.';

                    resetFingerSelection();

                }, 3000);

                fingerLoading.classList.remove(
                    'active'
                );

                const selectedElement =
                    document.querySelector(
                        `[data-touch-id="${randomId}"]`
                    );

                if (selectedElement) {

                    selectedElement.classList.add(
                        'selected'
                    );
                    fingerStatus.innerText =
                        'Dedo selecionado!';

                }

            }, 3000);

        }

        function createFingerPoint(id, x, y) {

            point.style.top = `${y}px`;

                document.querySelector(

                );

            if (!point) {
                return;
            }

            point.style.left = `${x}px`;
            point.style.top = `${y}px`;

        }

                e.preventDefault();
                e.stopPropagation();

                for (const touch of e.changedTouches) {

                    const rect =
                        fingerArea.getBoundingClientRect();

                    const x =
                        touch.clientX - rect.left;

                    const y =
                        touch.clientY - rect.top;

                    activeTouches.set(
                        touch.identifier,
                        { x, y }
                    );

                    createFingerPoint(
                        touch.identifier,
                        x,
                        y
                    );

                }

                updateFingerStatus();

            }
        );

                if (fingerSelectionLocked) {

                    const y =

                    activeTouches.set(

                    moveFingerPoint(
                        touch.identifier,
                        x,
                        y
                    );

            }

                    'block';

                stopTimerButton.style.display =
                    'block';

                pauseTimerButton.innerText =
                    'Reiniciar';

                timerInputs.style.display =
                    'none';

            } else {

                startTimerButton.style.display =
                    'block';

                pauseTimerButton.style.display =
                    'none';

                stopTimerButton.style.display =
                    'none';

                timerInputs.style.display =
                    'flex';

            }

        }
        function resetTimer() {
            timerDisplay.classList.remove(
                'timer-finished'
            );

            clearInterval(timerInterval);

            timerRunning = false;

            totalSeconds =
                (
                    Number(minutesInput.value) * 60
                ) +
                Number(secondsInput.value);

            updateTimerDisplay();

            updateTimerButtons();

        }

        timerButton.addEventListener('click', () => {

            openOverlay(timerModal);

        });

        function closeTimerModal() {

            timerModal.classList.remove('active');

            document.body.classList.remove('modal-open');

        }

        timerCloseButton.addEventListener(
            'click',
            closeTimerModal
        );

        timerModal.addEventListener('click', (e) => {

            if (e.target === timerModal) {

                closeTimerModal();

            }

        });

        minutesInput.addEventListener('input', () => {

            if (minutesInput.value > 59) {
                minutesInput.value = 59;
            }

            if (minutesInput.value < 0) {
                minutesInput.value = 0;
            }

            resetTimer();

        });

        secondsInput.addEventListener('input', () => {

            if (secondsInput.value > 59) {
                secondsInput.value = 59;
            }

            if (secondsInput.value < 0) {
                secondsInput.value = 0;
            }

            resetTimer();

        });

        startTimerButton.addEventListener('click', () => {
            timerDisplay.classList.remove(
                'timer-finished'
            );

            if (timerRunning) {
                return;
            }
            if (totalSeconds <= 0) {

                totalSeconds =
                    (
                        Number(minutesInput.value) * 60
                    ) +
                    Number(secondsInput.value);

                updateTimerDisplay();

            }

            timerRunning = true;

            updateTimerButtons();

            timerInterval = setInterval(() => {

                if (totalSeconds <= 0) {

                    clearInterval(timerInterval);

                    timerRunning = false;
                    timerPaused = false;

                    totalSeconds = 0;

                    updateTimerDisplay();

                    timerDisplay.classList.add(
                        'timer-finished'
                    );

                    startTimerButton.style.display =
                        'block';

                    pauseTimerButton.style.display =
                        'none';

                    stopTimerButton.style.display =
                        'none';

                    timerInputs.style.display =
                        'flex';

                    return;

                }

                totalSeconds--;

                updateTimerDisplay();

            }, 1000);

        });

        pauseTimerButton.addEventListener('click', () => {

            if (timerRunning) {

                clearInterval(timerInterval);

                timerRunning = false;
                timerPaused = true;

                updateTimerButtons();

            } else {

                timerRunning = true;
                timerPaused = false;

                updateTimerButtons();

                timerInterval = setInterval(() => {

                    if (totalSeconds <= 0) {

                        clearInterval(timerInterval);

                        timerRunning = false;
                        timerPaused = false;

                        totalSeconds = 0;

                        updateTimerDisplay();

                        timerDisplay.classList.add(
                            'timer-finished'
                        );

                        startTimerButton.style.display =
                            'block';

                        pauseTimerButton.style.display =
                            'none';

                        stopTimerButton.style.display =
                            'none';

                        timerInputs.style.display =
                            'flex';

                        return;

                    }

                    totalSeconds--;

                    updateTimerDisplay();

                }, 1000);

            }

        });

        stopTimerButton.addEventListener('click', () => {

            clearInterval(timerInterval);

            timerRunning = false;
            timerPaused = false;

            totalSeconds =
                (
                    Number(minutesInput.value) * 60
                ) +
                Number(secondsInput.value);

            updateTimerDisplay();

            updateTimerButtons();

        });

        updateTimerDisplay();

        updateTimerButtons();
        fingerArea.addEventListener(
            'contextmenu',
            (e) => {

                e.preventDefault();

            }
        );
    </script>



</body>

</html>
