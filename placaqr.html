<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Catálogo QR
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#222;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

#printArea{

    width:210mm;
    height:297mm;

    background:white;

    margin:0 auto;

    display:flex;

    align-items:center;

    justify-content:center;

}

.content{

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    box-sizing:border-box;

    padding-top:30mm;
    padding-bottom:26mm;

}

.title{

    font-size:54px;

    font-weight:800;

    text-align:center;

    line-height:1.05;

    color:#111;
    margin-top:50px;

    margin-bottom:48px;

}

.qr{

    width:120mm;
    height:120mm;

    image-rendering:pixelated;

    margin-top:auto;

    margin-bottom:auto;

}

.bottom{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    margin-top:30px;

}

.url{

    font-size:28px;

    font-weight:700;

    color:#222;

}

.tip{

    margin-top:16px;

    font-size:22px;

    color:#666;

}

.export-button{

    position:fixed;

    top:18px;

    right:18px;

    border:none;

    background:#4dffac;

    color:#111;

    font-size:16px;

    font-weight:700;

    padding:14px 20px;

    border-radius:14px;

    cursor:pointer;

    z-index:999;

}

</style>

</head>

<body>

<button
    class="export-button"
    onclick="exportPDF()"
>
    Exportar PDF
</button>

<div id="printArea">

    <div class="content">

        <div class="title">
            Catálogo de Jogos
        </div>

        <img
            class="qr"
            src="qr.jpg"
        >

        <div class="bottom">

            <div class="url">
                gvpm.github.io/catalogodejogos
            </div>

            <div class="tip">
                Escaneie para abrir o catálogo digital
            </div>

        </div>

    </div>

</div>

<script>

async function exportPDF(){

    const element =
        document.getElementById(
            'printArea'
        );

    const canvas =
        await html2canvas(
            element,
            {
                scale:4,
                backgroundColor:'#ffffff',
                useCORS:true
            }
        );

    const imgData =
        canvas.toDataURL(
            'image/jpeg',
            1.0
        );

    const { jsPDF } = window.jspdf;

    const pdf =
        new jsPDF({
            orientation:'portrait',
            unit:'mm',
            format:'a4'
        });

    pdf.addImage(
        imgData,
        'JPEG',
        0,
        0,
        210,
        297
    );

    pdf.save('catalogo_qr.pdf');

}

</script>

</body>
</html>
